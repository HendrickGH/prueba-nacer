services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: github-profile-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
    container_name: github-profile-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
